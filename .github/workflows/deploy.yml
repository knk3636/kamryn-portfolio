name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply portfolio content fixes
        run: |
          sed -i '/^[[:space:]]*([[:space:]]*$/d' src/App.jsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace('https://www.github.com', 'https://github.com/knk3636')
          s = s.replace('A selection of work that highlights how I plan, coordinate, and deliver projects,while incorporating product thinking to improve outcomes.', 'A selection of work that highlights how I approach product problems, collaborate across teams, and turn ideas and requirements into meaningful outcomes.')
          s = s.replace('Led concept development of an IBS tracking app,defined requirements, prioritized features, and structured an MVP focused on user pain points and consistency.', 'Led concept development of an IBS tracking app, defined requirements, prioritized features, and structured an MVP focused on user pain points and consistency.')
          p.write_text(s)
          PY

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
